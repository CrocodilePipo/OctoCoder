schema_version: 1
id: context-smoke
description: Mandatory deterministic context-management gate; offline and credential-free.
cases: [context-retention-success]
repeat: 1
thresholds:
  failed_runs_increase: 0
  context_retention_drop: 0
  context_adherence_drop: 0
  context_resume_drop: 0
  context_token_error_increase_tokens: 500
  context_reclaimed_tokens_drop: 10000
  context_retained_tokens_increase: 1000
  context_compaction_count_increase: 0
  context_contamination_increase: 0
